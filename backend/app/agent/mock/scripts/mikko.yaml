persona: mikko
steps:
  # Turn 1: Onboarding greeting, questionnaire review, initial fit and request for TrackMan CSV
  - text: "Hi Mikko, welcome to Takomo Fitter Studio. Let's find your perfect irons."
  - text: "From your answers alone, this fit is provisional. Measured shots will firm it up."
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - ui:
      type: data_import
      prompt: "To dial in your true speed and lie angle, import your 7-iron TrackMan data."
      sources: ["csv", "skip"]
      club_hint: own_7i
      reason_code: swing_speed

  # Turn 2: Review TrackMan CSV, surface G11 flag and loft difference
  - tool_call:
      name: get_import_report
      args: {}
  - text: "Thanks, your shots are in. Your measured carry and the carry you told me do not match. Please check it below."
  - ui:
      type: outlier_review
      import_id: $get_import_report.import_id
      flags: $state.pending_flags
      shots_summary: $get_import_report.shots_summary
      actions:
        - confirm_value
        - keep

  # Turn 3: Precision follow-up offer for test club shots
  - tool_call:
      name: run_fit
      args: {}
  - text: "With your measured speed in, watch the confidence meter rise."
  - text: "Your lie still comes from a static chart. Shots with a Takomo test club on a launch monitor show your lie at impact."
  - ui:
      type: data_import
      prompt: "Import your Takomo 201 MKII test-club shots to firm up your lie."
      sources: ["csv", "skip"]
      club_hint: takomo_201-mkii_kbs-tour-regular_std
      reason_code: lie

  # Turn 4: Final fit recommendation after test-club import
  - tool_call:
      name: update_profile
      args: {own_7i_loft_deg: 28} # Mikko's answer (input), not a claim
  - tool_call:
      name: run_fit
      args: {}
  - text: "Your test-club shots now set your lie."
  - text: "Here is your recommended build. Every spec on the card comes straight from the fit."
  - ui:
      type: recommendation_card
      # Bound to the live fit so the card always matches the buy bar and the header confidence.
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - tool_call:
      name: explain_part
      as: why_head
      args: {part: head}
  - tool_call:
      name: explain_part
      as: why_flex
      args: {part: flex}
  - tool_call:
      name: explain_part
      as: why_length
      args: {part: length}
  - tool_call:
      name: explain_part
      as: why_lie
      args: {part: lie}
  - tool_call:
      name: explain_part
      as: why_grip
      args: {part: grip}
  - ui:
      type: why_panel
      depth: standard
      items: [$why_head.why, $why_flex.why, $why_length.why, $why_lie.why, $why_grip.why]
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head, $state.runner_up.head]}
  - ui:
      type: club_compare
      highlight: $state.best.head
      heads:
        - head: $simulate_flight.result.per_head.0.head
          carry: $simulate_flight.result.per_head.0.summary.carry.mean
          apex: $simulate_flight.result.per_head.0.summary.apex
          land_angle: $simulate_flight.result.per_head.0.summary.land_angle
          side_sd: $simulate_flight.result.per_head.0.summary.side.sd
          score_total: $run_fit.ranking.0.total
        - head: $simulate_flight.result.per_head.1.head
          carry: $simulate_flight.result.per_head.1.summary.carry.mean
          apex: $simulate_flight.result.per_head.1.summary.apex
          land_angle: $simulate_flight.result.per_head.1.summary.land_angle
          side_sd: $simulate_flight.result.per_head.1.summary.side.sd
          score_total: $run_fit.ranking.1.total
  - ui:
      type: stock_vs_custom
      question: "Your fitted build is a custom order. Custom clubs cannot be returned. A stock set has a 30-day return. Which do you prefer?"
      reasons: []
      stock_return_days: 30
      custom_returnable: false

  # Turn 5: Confirmation and save
  - text: "Thanks, your choice is noted."
  - text: "Use Save at the top to keep a link to your fit."
  - ui:
      type: driver_teaser
