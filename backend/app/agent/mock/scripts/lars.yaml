persona: lars
steps:
  # Turn 1: Tour player evaluation and 301 CB vs 301 MB close call
  - text: "Welcome Lars. At 88 mph 7-iron speed, you can play either of our tour forged irons."
  - tool_call:
      name: run_fit
      args: {}
  - text: "We're looking at a dead heat between the 301 CB and 301 MB. No sales BS—here's the raw trade-off between the two."
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head, $state.runner_up.head]}
  - ui:
      type: club_compare
      highlight: $state.best.head
      heads:
        - head: $simulate_flight.result.per_head.0.head
          carry: $simulate_flight.result.per_head.0.summary.carry.mean
          apex: $simulate_flight.result.per_head.0.summary.apex
          land_angle: $simulate_flight.result.per_head.0.summary.land_angle
          side_sd: $simulate_flight.result.per_head.0.summary.side.sd
          score_total: $run_fit.ranking.0.total
        - head: $simulate_flight.result.per_head.1.head
          carry: $simulate_flight.result.per_head.1.summary.carry.mean
          apex: $simulate_flight.result.per_head.1.summary.apex
          land_angle: $simulate_flight.result.per_head.1.summary.land_angle
          side_sd: $simulate_flight.result.per_head.1.summary.side.sd
          score_total: $run_fit.ranking.1.total
  - ui:
      type: recommendation_card
      # Bound to the live fit so the card always matches the buy bar and the header confidence.
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - tool_call:
      name: explain_part
      as: why_head
      args: {part: head}
  - tool_call:
      name: explain_part
      as: why_shaft
      args: {part: shaft_model}
  - ui:
      type: why_panel
      depth: numbers
      items: [$why_head.why, $why_shaft.why]
  - ui:
      type: choice_chips
      prompt: "Which matters more to your scoring: the slight toe-strike forgiveness of the CB, or the surgical shot-shaping of the MB blade?"
      field: head_choice
      options:
        - id: 301-cb
          label: "Takomo 301 CB (Cavity Back)"
        - id: 301-mb
          label: "Takomo 301 MB (Muscle Back)"

  # Turn 2: Selected build confirmation and flight view
  - text: "Both heads give you forged feel and workability."
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head, $state.runner_up.head]}
  - text: "Dispersion is mapped on the stage. Tweak in Tinker or hit Save in the top bar."
