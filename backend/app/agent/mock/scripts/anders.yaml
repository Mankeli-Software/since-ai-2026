persona: anders
steps:
  # Turn 1: welcome, then his test-club shots (Takomo 201 MKII on a simulator)
  - text: "Hello Anders, welcome to Takomo Fitter Studio."
  - text: "Your answers put you close to a stock set. Your test-club shots decide the one part that could change that: the lie."
  - ui:
      type: data_import
      prompt: "Import your Takomo 201 MKII test-club shots."
      sources: ["csv", "skip"]
      club_hint: takomo_201-mkii_kbs-tour-regular_std
      reason_code: lie

  # Turn 2: fit from the shots (every spec value from the live state), stock vs custom on lie
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - ui:
      type: recommendation_card
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items:
        - part: lie
          plain: "Your test-club shots average +1° upright. In standard lie, the face sits slightly open at impact, which causes a mild push to the right."
          numbers:
            dynamic_lie_deg: 63.0
            lie_deg: 1.0
          sources:
            - source: trackman
        - part: purchase
          plain: "Stock sets come with 0° lie and include a 30-day return policy. Custom +1° lie bending makes the set non-returnable."
          numbers:
            stock_return_days: 30
          sources:
            - source: questionnaire
  - ui:
      type: stock_vs_custom
      question: "A +1° upright lie straightens ~3 yards of push miss, but custom builds cannot be returned. Standard stock lie includes a 30-day trial return policy. Which do you prefer?"
      reasons:
        - "Dynamic lie is +1° upright (custom build, non-returnable)"
        - "Standard stock lie is 0° (includes 30-day return policy)"
      stock_return_days: 30
      custom_returnable: false

  # Turn 3: Confirmation
  - text: "That is an honest trade-off. Many players start with stock clubs and have a local clubmaker bend them 1° if needed, preserving return flexibility."
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head]}
  - text: "Your configuration is ready. Test different lie settings in the Tinker panel or save your build."
