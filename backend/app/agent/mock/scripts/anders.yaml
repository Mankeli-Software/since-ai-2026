persona: anders
steps:
  # Turn 1: welcome, then his test-club shots (Takomo 201 MKII on a simulator)
  - text: "Hej Anders. Your numbers put you right on the doorstep of a stock set."
  - text: "Let's see your test-club shots to settle the one spec that could change that: your lie angle."
  - ui:
      type: data_import
      prompt: "Import your Takomo 201 MKII test-club shots."
      sources: ["csv", "skip"]
      club_hint: takomo_201-mkii_kbs-tour-regular_std
      reason_code: lie

  # Turn 2: fit from the shots (every spec value from the live state), stock vs custom on lie
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - ui:
      type: recommendation_card
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items:
        - part: lie
          plain: "Your test-club shots average +1° upright. In standard lie, the face sits slightly open at impact, which causes a mild push to the right."
          numbers:
            dynamic_lie_deg: 63.0
            lie_deg: 1.0
          sources:
            - source: trackman
        - part: purchase
          plain: "Stock sets come with 0° lie and include a 30-day return policy. Custom +1° lie bending makes the set non-returnable."
          numbers:
            stock_return_days: 30
          sources:
            - source: questionnaire
  - ui:
      type: stock_vs_custom
      question: "A +1° upright bend straightens out about 3 yards of push miss. But custom builds are non-returnable, whereas stock gives you 30 days to play them risk-free. Which way do you want to go?"
      reasons:
        - "Dynamic lie is +1° upright (custom build, non-returnable)"
        - "Standard stock lie is 0° (includes 30-day return policy)"
      stock_return_days: 30
      custom_returnable: false

  # Turn 3: Confirmation
  - text: "Smart move. A lot of golfers grab stock to keep the 30-day safety net, then have a local pro bend them 1° later if they want it."
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head]}
  - text: "Your build is dialled in. Test other lies in the Tinker panel or hit Save in the top bar."
