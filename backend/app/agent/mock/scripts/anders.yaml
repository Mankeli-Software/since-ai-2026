# Anders (DEMO-13): stock (returnable) vs custom (non-returnable) on a +1° lie change from his
# test-club shots (plan L8). Every number in the chat comes from the state or a tool output of the
# same turn: `$ref` for a whole value, `{$ref:fmt}` inside a sentence (scripted_engine). Never type
# a number in here.
persona: anders
steps:
  # Turn 1: welcome, then his test-club shots (Takomo 201 MKII on a simulator)
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: explain_part
      as: why_purchase
      args: {part: purchase}
  - text:
      by: $state.best.purchase
      cases:
        custom: "Hej Anders. You're right on the doorstep of a stock set. On your answers alone: {$why_purchase.why.plain}"
        stock: "Hej Anders. On your answers alone, your set comes out stock."
      default: "Hej Anders. Let's get your irons sorted."
  - text: "Let's see your test-club shots to settle the one spec that could change that: your lie angle."
  - ui:
      type: data_import
      prompt: "Import your Takomo 201 MKII test-club shots."
      sources: ["csv", "skip"]
      club_hint: takomo_201-mkii_kbs-tour-regular_std
      reason_code: lie

  # Turn 2: fit from the shots (every spec value from the live state), stock vs custom on lie
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - tool_call:
      name: explain_part
      as: why_lie
      args: {part: lie}
  - tool_call:
      name: explain_part
      as: why_purchase
      args: {part: purchase}
  - tool_call:
      name: stock_advice
      args: {}
  - text:
      by: $why_lie.why.sources.0.source
      cases:
        trackman: "Your {$why_lie.why.sources.0.n} test-club shots are in, and they set your lie at {$state.best.lie_deg:+d}°."
      default: "No test-club shots this time, so your lie stays on the sizing chart at {$state.best.lie_deg:+d}°."
  - ui:
      type: recommendation_card
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items: [$why_lie.why, $why_purchase.why]
  - ui:
      type: stock_vs_custom
      question:
        by: $state.best.purchase
        cases:
          custom: "Custom builds your {$state.best.lie_deg:+d}° lie in, but custom clubs can't be returned. Stock comes with a {$stock_advice.advice.stock_return_days}-day return. Which way do you want to go?"
        default: "Your fit is a stock set with a {$stock_advice.advice.stock_return_days}-day return. Stock or custom?"
      reasons:
        - "Custom: {$state.best.lie_deg:+d}° lie, built to order, non-returnable"
        - "Stock: {$stock_advice.advice.stock.lie_deg:d}° lie, {$stock_advice.advice.stock_return_days}-day return"
        - "Flight model: stock lands {$stock_advice.advice.side_delta_yd:.1f} yd further right on average"
      stock_return_days: $stock_advice.advice.stock_return_days
      custom_returnable: false

  # Turn 3: Confirmation
  - tool_call:
      name: stock_advice
      args: {}
  - text:
      by: $answer
      cases:
        stock: "Fair trade-off. Stock keeps the {$stock_advice.advice.stock_return_days}-day safety net, so you can try the standard lie on the course first."
        custom: "Custom it is. Your lie gets built in, just remember custom clubs can't be returned."
      default: "Choice noted. Stock keeps the {$stock_advice.advice.stock_return_days}-day return, custom gets your lie built in."
  - tool_call:
      name: simulate_flight
      args: {heads: [$state.best.head]}
  - text: "Your build is ready. Open **Why each part** to see where every spec came from, or hit Save in the top bar."
