persona: hannu
steps:
  # Turn 1: Questionnaire review and ball-line test prompt
  - text: "Hi Hannu, welcome to Takomo Fitter Studio. Let's find the best irons for your game."
  - text: "From your questionnaire, you carry your 7-iron 125 yards. The static sizing chart suggests a standard lie, but dynamic delivery on turf often tells a different story."
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - ui:
      type: data_import
      prompt: "A quick 5-shot ball-line test on a mat shows which way your club leans at impact. Enter your marker-line readings below."
      sources: ["ball_line", "skip"]
      club_hint: own_7i
      reason_code: lie_ball_line

  # Turn 2: Ball-line results, honest close call explanation and simulator recommendation
  - text: "We received your 5 marker-line readings."
  - text: "Here is our honest assessment: the marker-line test on a range mat is approximate (sigma ~1.5°). When fused with your sizing chart, your lie angle remains a genuine close call between Standard and 1° Upright. In addition, without measured club speed, your flex is on the boundary."
  - tool_call:
      name: run_fit
      args: {}
  - ui:
      type: recommendation_card
      # Bound to the live fit so the card always matches the buy bar and the header confidence.
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items:
        - part: lie
          plain:
            by: $state.per_part.lie.alt
            cases:
              "1": "Lie is a close call: readings lean upright. A test-club session on a simulator gives the number."
              "-1": "Lie is a close call: readings lean flat. A test-club session on a simulator gives the number."
            default: "Lie is a close call: readings lean upright. A test-club session on a simulator gives the number."
          numbers:
            lie_deg: $state.best.lie_deg
          sources:
            - source: questionnaire
            - source: ball_line
  - text: "Rather than locking in a non-returnable custom order on rough mat data, we honestly recommend testing a Takomo 7-iron on a simulator first."
  - ui:
      type: simulator_map
      simulator_ids:
        - helsinki_indoor
        - espoo_fitting
        - turku_fitting
  - text: "Hitting 5 to 10 shots on a TrackMan near you will turn this provisional fit into a confident specification."
