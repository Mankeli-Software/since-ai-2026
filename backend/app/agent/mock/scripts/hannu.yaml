# Hannu (DEMO-09): ball-line readings, no TrackMan. Fused with the chart his lie stays a close call
# (and flex too, from carry only), so the studio honestly sends him to a simulator (plan L8).
# Every number in the chat comes from the state or a tool output of the same turn: `$ref` for a
# whole value, `{$ref:fmt}` inside a sentence (scripted_engine). Never type a number in here.
persona: hannu
steps:
  # Turn 1: the chart's lie, then the ball-line test
  - text: "Moi Hannu. Let's get your irons sorted."
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: get_close_call
      args: {part: lie}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - text:
      by: $get_close_call.status
      cases:
        ok: "From your height and wrist-to-floor, the sizing chart puts your lie between {$get_close_call.ours_label} and {$get_close_call.alt_label}. That's a close call, so let's see how your own club sits at impact."
      default: "From your height and wrist-to-floor, the sizing chart gives {$state.best.lie_deg:+d}° lie. Let's see how your own club sits at impact."
  - ui:
      type: data_import
      prompt: "A quick ball-line test on a mat shows which way your club leans at impact. Enter your marker-line readings below."
      sources: ["ball_line", "skip"]
      club_hint: own_7i
      reason_code: lie_ball_line

  # Turn 2: the fused lie and flex, honestly still close; a simulator settles them
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: explain_part
      as: why_lie
      args: {part: lie}
  - tool_call:
      name: explain_part
      as: why_flex
      args: {part: flex}
  - tool_call:
      name: get_close_call
      as: lie_call
      args: {part: lie}
  - tool_call:
      name: get_close_call
      as: flex_call
      args: {part: flex}
  - tool_call:
      name: stock_advice
      args: {}
  - text:
      by: $why_lie.why.sources.0.source
      cases:
        ball_line: "Got your {$why_lie.why.sources.0.n} ball-line readings."
      default: "No ball-line readings this time, so your lie stays on the sizing chart."
  - text:
      by: $why_lie.why.sources.0.source
      cases:
        ball_line:
          by: $lie_call.status
          cases:
            ok: "Straight-up Finnish honesty: a marker line off a mat is rough data. Fused with the chart, your lie is a close call between {$lie_call.ours_label} and {$lie_call.alt_label}. We keep {$lie_call.ours_label} for now."
          default: "Fused with the chart, your readings give {$state.best.lie_deg:+d}° lie."
      default:
        by: $lie_call.status
        cases:
          ok: "That leaves your lie a close call between {$lie_call.ours_label} and {$lie_call.alt_label}. We keep {$lie_call.ours_label} for now."
  - text:
      by: $flex_call.status
      cases:
        ok: "Flex is close too. Without measured shots we estimate {$why_flex.why.numbers.speed_mph:.1f} mph from your {$profile.reported_7i_carry_yd:.0f}-yard carry, which sits between {$flex_call.ours_label} and {$flex_call.alt_label}."
  - ui:
      type: recommendation_card
      # Bound to the live fit so the card always matches the buy bar and the header confidence.
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items: [$why_lie.why, $why_flex.why]
  - text:
      by: $state.best.purchase
      cases:
        stock: "As it stands your set is stock, so you keep the {$stock_advice.advice.stock_return_days}-day return. Still, we'd rather you hit a Takomo test club on a simulator before anyone settles your lie."
        custom: "This build would be a custom order, and custom clubs can't be returned. Rather than nudge you into that off a mat test, we'd rather you hit a Takomo test club on a simulator first."
  - ui:
      type: simulator_map
      simulator_ids:
        - helsinki_indoor
        - espoo_fitting
        - turku_fitting
  - text: "Test-club shots at one of these will turn this close call into a number. Hit Save in the top bar to keep your fit until then."
