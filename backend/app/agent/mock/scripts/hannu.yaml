persona: hannu
steps:
  # Turn 1: Questionnaire review and ball-line test prompt
  - text: "Moi Hannu. Let's get your irons sorted."
  - text: "From your answers, you carry your 7-iron 145 yards. Static sizing charts say standard lie, but turf contact at impact usually tells the real truth."
  - tool_call:
      name: run_fit
      args: {}
  - tool_call:
      name: stage_focus
      args: {part: lie}
  - ui:
      type: data_import
      prompt: "A quick 5-shot ball-line test on a mat shows which way your club leans at impact. Enter your marker-line readings below."
      sources: ["ball_line", "skip"]
      club_hint: own_7i
      reason_code: lie_ball_line

  # Turn 2: Ball-line results, honest close call explanation and simulator recommendation
  - text: "Got your 5 ball-line marks."
  - text: "Here's our straight-up Finnish honesty: a sharpie line off a range mat is noisy data. Fusing it with your static chart leaves lie angle right on the razor's edge between Standard and 1° Upright—and your flex is right on the line without measured speed."
  - tool_call:
      name: update_profile
      args: {lie_override_deg: 0.8}
  - tool_call:
      name: run_fit
      args: {}
  - ui:
      type: recommendation_card
      # Bound to the live fit so the card always matches the buy bar and the header confidence.
      spec: $state.best
      purchase: $state.best.purchase
      confidence: $state.confidence
      gate: $state.gate
      strength: $state.strength
      runner_up: $state.runner_up
  - ui:
      type: why_panel
      depth: standard
      items:
        - part: lie
          plain: "Lie is a close call: static chart suggests 0° Standard, while your ball-line readings lean +0.8° upright. Testing on a simulator is recommended before ordering custom."
          numbers:
            lie_deg: 0.0
          sources:
            - source: questionnaire
            - source: ball_line
  - text: "Rather than nudging you into a non-returnable custom order based on a mat test, we'd rather you hit 10 balls with a Takomo test club on a simulator first."
  - ui:
      type: simulator_map
      simulator_ids:
        - helsinki_indoor
        - espoo_fitting
        - turku_fitting
  - text: "Hitting 5 to 10 shots on a TrackMan near you will turn this educated guess into dead certainty."
